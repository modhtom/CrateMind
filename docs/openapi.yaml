openapi: 3.0.3
info:
  title: CrateMind API
  description: API documentation for CrateMind project. Used for demonstrating endpoints to HR/Interviewers.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /orders:
    post:
      summary: Create a new order
      description: Creates a new order containing a customer ID and a list of items to be processed by the microservices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: string
                format: uuid
                example: "123e4567-e89b-12d3-a456-426614174000"
components:
  schemas:
    OrderRequest:
      type: object
      properties:
        customerId:
          type: string
          description: Unique identifier for the customer
          example: "cust-12345"
        items:
          type: array
          description: List of items included in the order
          items:
            $ref: '#/components/schemas/ItemRequest'
    ItemRequest:
      type: object
      properties:
        productId:
          type: string
          description: Unique identifier for the product
          example: "prod-987"
        quantity:
          type: integer
          description: Quantity of the product ordered
          example: 2
